<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Команда — КАРТОННИКИ ТВ 2D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .header {
            background: #000;
            color: #fff;
            text-align: center;
            padding: 40px 20px;
        }

        .header h1 {
            font-size: 36px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            color: #cccccc;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 24px;
            font-size: 16px;
            text-decoration: none;
            color: #fff;
            background: #000;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #333;
        }

        .main {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        .main h2 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        .member {
            background: #fff;
            border: 2px solid #000;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .member h3 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .member p {
            font-size: 17px;
            color: #444;
        }

        .photo {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #000;
            margin-bottom: 12px;
        }

        .years {
            font-size: 15px;
            color: #777;
        }

        .footer {
            background: #000;
            color: #fff;
            text-align: center;
            padding: 30px 20px;
            margin-top: 40px;
        }

        .footer p {
            color: #cccccc;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>КАРТОННИКИ ТВ 2D</h1>
        <p>официальный сайт проекта</p>
    </header>

    <div class="back">
        <a class="btn" href="/home.html">← На главную</a>
    </div>

    <main class="main">
        <h2>Наша команда</h2>

        <div class="member">
            <img class="photo" src="ivan.jpg" alt="Иван Гораньков">
            <h3>Иван Гораньков</h3>
            <p>Основатель проекта</p>
            <p class="years">Работает с 2026 г. по настоящее время</p>
        </div>

        <div class="member">
            <h3>Ясмина</h3>
            <p>Актёр озвучки</p>
        </div>

        <div class="member">
            <h3>Елизавета</h3>
            <p>Актёр озвучки</p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 KartonnikiTV2D. Все права защищены.</p>
    </footer>

</body>
</html>
